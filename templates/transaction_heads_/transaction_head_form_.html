{% extends 'base.html' %}
{% load static %}

{% block title %}New Transaction Head{% endblock %}

{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Teacher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <div class="row">
      
      <!-- Left: Add Subject Form -->

      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <h2>New Transaction Head....</h2>
          <form id="addForm" method="POST">
            {% csrf_token %}

              <div class="mb-3">
                <label class="form-label fw-semibold">Account Main Heads</label>
                <select id="transactionmainheads" name="transactionmainheads" class="form-control">

                </select>
              </div>
              <div class="col-md-4">
                  <label class="fw-semibold">Transaction Method</label>
                  <select id="transaction_method" name="transaction_method" class="form-control">

                  </select>
              </div>
              <div class="col-md-4">
                  <label class="fw-semibold">Transaction Group</label>
                  <select id="transactiongroups" name="transactiongroups" class="form-control">

                  </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Transaction Head Name</label>
                <input type="text" id="tran_head" name="tran_head" class="form-control" placeholder="Enter full name">
                <span class="text-danger small name_error"></span>
              </div>

              <div class="mb-3" style="display:none;">
                <label class="form-label fw-semibold">Status</label>
                <select name="status" class="form-select">
                  <option value="">Select Status</option>
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
                <span class="text-danger small status_error"></span>
              </div>

            
            <div class="d-flex justify-content-center mt-3">
              <button type="submit" id="saveBtn" class="btn btn-primary me-2 px-4">
                💾 Save
              </button>
              <a href="#" class="btn btn-success px-4">
                  ⬅️ Back
              </a>
            </div>

          </form>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <div class="table-responsive" style="max-height: 800px; overflow-y: auto;" id="tableContainerRight">
            <table class="table table-bordered table-striped table-hover table-sm custom-border full-width-table" id="staffTableRight">
              <thead class="table-dark" style="position: sticky; top: 0; z-index: 2;">
                <tr>
                    <th>#</th>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
              </thead>
              <tbody id="studentAdmissionTableBody">    
                  
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>  

</body>
</html>

{% endblock %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="{% static 'js/save_csrftoken.js' %}"></script>
<script src="{% static 'js/transaction_main_heads/transaction_main_heads_combo.js' %}"></script>
<script src="{% static 'js/transaction_groupes/transaction_method_combo.js' %}"></script>
<script src="{% static 'js/transaction_groupes/transaction_groups_combo.js' %}"></script>
<!-- <script src="{% static 'js/transaction_main_heads/transaction_main_heads.js' %}"></script> -->
<script src="{% static 'js/transaction_heads/save_transaction_heads.js' %}"></script>



{% endblock %}
