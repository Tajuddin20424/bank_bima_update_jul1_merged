<div class="regular-prescription-template">

    <div class="template-header">
        <div>
            <h4 class="template-title">Regular Prescription</h4>
            <div class="template-subtitle">
                Add clinical notes, medicines, investigations, instructions and follow-up.
            </div>
        </div>

        <div class="template-badge">
            Rx Prescription
        </div>
    </div>

    <div class="prescription-grid">

        <!-- Pair 1 -->
        <div class="prescription-field-card">
            <label>Parameter</label>
            <input type="text"
                   class="prescription-param"
                   value="C/C"
                   placeholder="Parameter">

            <div class="prescription-hint">Chief complaint</div>
        </div>

        <div class="prescription-field-card">
            <label>Details</label>
            <textarea class="prescription-detail"
                      placeholder="Write chief complaint"></textarea>
        </div>

        <!-- Pair 2 -->
        <div class="prescription-field-card">
            <label>Parameter</label>
            <input type="text"
                   class="prescription-param"
                   value="O/E"
                   placeholder="Parameter">

            <div class="prescription-hint">On examination</div>
        </div>

        <div class="prescription-field-card">
            <label>Details</label>
            <textarea class="prescription-detail"
                      placeholder="Write examination findings"></textarea>
        </div>

        <!-- Pair 3 -->
        <div class="prescription-field-card">
            <label>Parameter</label>
            <input type="text"
                   class="prescription-param"
                   value="Diagnosis"
                   placeholder="Parameter">

            <div class="prescription-hint">Final or provisional diagnosis</div>
        </div>

        <div class="prescription-field-card">
            <label>Details</label>
            <textarea class="prescription-detail"
                      placeholder="Write diagnosis"></textarea>
        </div>

        <!-- Pair 4 -->
        <div class="prescription-field-card">
            <label>Parameter</label>
            <input type="text"
                   class="prescription-param"
                   value="Rx / Medicine"
                   placeholder="Parameter">

            <div class="prescription-hint">Medicines will appear in the Rx side</div>
        </div>

        <div class="prescription-field-card full-width-prescription">
            <label>Medicine Builder</label>

            <div class="rx-builder-panel">

                <div class="rx-builder-row">
                    <select class="rx-medicine-select">
                        <option value="">Select Medicine</option>
                        <option value="Tab. Napa 500mg">Tab. Napa 500mg</option>
                        <option value="Tab. Paracetamol 500mg">Tab. Paracetamol 500mg</option>
                        <option value="Tab. Ace 500mg">Tab. Ace 500mg</option>
                        <option value="Cap. Omeprazole 20mg">Cap. Omeprazole 20mg</option>
                        <option value="Tab. Seclo 20mg">Tab. Seclo 20mg</option>
                        <option value="Tab. Sergel 20mg">Tab. Sergel 20mg</option>
                        <option value="Tab. Fexo 120mg">Tab. Fexo 120mg</option>
                        <option value="Tab. Montair 10mg">Tab. Montair 10mg</option>
                        <option value="Tab. Monas 10mg">Tab. Monas 10mg</option>
                        <option value="Syp. Ambroxol">Syp. Ambroxol</option>
                        <option value="ORS Saline">ORS Saline</option>
                        <option value="Tab. Zinc 20mg">Tab. Zinc 20mg</option>
                        <option value="Cap. Doxycycline 100mg">Cap. Doxycycline 100mg</option>
                        <option value="Tab. Azithromycin 500mg">Tab. Azithromycin 500mg</option>
                        <option value="Tab. Cefixime 200mg">Tab. Cefixime 200mg</option>
                    </select>

                    <select class="rx-frequency-select">
                        <option value="">Frequency</option>
                        <option value="1 + 0 + 0">Morning</option>
                        <option value="0 + 1 + 0">Noon</option>
                        <option value="0 + 0 + 1">Night</option>
                        <option value="1 + 0 + 1">Morning + Night</option>
                        <option value="1 + 1 + 0">Morning + Noon</option>
                        <option value="0 + 1 + 1">Noon + Night</option>
                        <option value="1 + 1 + 1">Morning + Noon + Night</option>
                        <option value="As needed">As needed</option>
                    </select>

                    <input type="text"
                           class="rx-duration-input"
                           placeholder="Duration e.g. 7 days">

                    <button type="button" class="rx-add-medicine-btn">
                        Add Medicine
                    </button>
                </div>

                <div class="rx-quick-frequency">
                    <button type="button" data-frequency="1 + 0 + 0">Morning</button>
                    <button type="button" data-frequency="0 + 1 + 0">Noon</button>
                    <button type="button" data-frequency="0 + 0 + 1">Night</button>
                    <button type="button" data-frequency="1 + 0 + 1">M + N</button>
                    <button type="button" data-frequency="1 + 1 + 1">3 Times</button>
                </div>

                <textarea class="prescription-detail prescription-medicine-field"
                          placeholder="Medicine list will appear here. You can also write manually."></textarea>
            </div>
        </div>

        <!-- Pair 5 -->
        <div class="prescription-field-card">
            <label>Parameter</label>
            <input type="text"
                   class="prescription-param"
                   value="Investigation / Test"
                   placeholder="Parameter">

            <div class="prescription-hint">Tests or reports</div>
        </div>

        <div class="prescription-field-card">
            <label>Details</label>
            <textarea class="prescription-detail"
                      placeholder="Write test name or investigation"></textarea>
        </div>

        <!-- Pair 6 -->
        <div class="prescription-field-card">
            <label>Parameter</label>
            <input type="text"
                   class="prescription-param"
                   value="Instructions"
                   placeholder="Parameter">

            <div class="prescription-hint">Advice, precautions or notes</div>
        </div>

        <div class="prescription-field-card">
            <label>Details</label>
            <textarea class="prescription-detail"
                      placeholder="Write instructions or advice"></textarea>
        </div>

        <!-- Pair 7 -->
        <div class="prescription-field-card">
            <label>Parameter</label>
            <input type="text"
                   class="prescription-param"
                   value="Follow Up"
                   placeholder="Parameter">

            <div class="prescription-hint">Next visit or review date</div>
        </div>

        <div class="prescription-field-card">
            <label>Details</label>
            <textarea class="prescription-detail"
                      placeholder="Write follow-up instruction"></textarea>
        </div>

    </div>
</div>
