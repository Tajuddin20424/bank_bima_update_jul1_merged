{% extends "base.html" %}
{% load static %}

{% block title %}Party Payment{% endblock %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="card shadow" style="min-height: 85vh;">

        <!-- HEADER -->
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Party Payment</h5>
        </div>

        <div class="card-body">

            <!-- 🔥 CASCADING FILTER (NEW) -->
            <div class="row mb-3">

                <div class="col-md-4">
                    <label class="fw-semibold">Transaction Main Head....</label>
                    <select id="transactionmainheads" class="form-select">
                        <option value="">Select Main Head</option>
                    </select>
                </div>

                <!-- WITH METHOD -->
                <div class="col-md-4">
                    <label class="fw-semibold">Transaction With Method</label>
                    <select id="transaction_with_method" name="transaction_with_method" class="form-control">

                    </select>
                </div>
                
                <div class="col-md-4">
                    <label class="fw-semibold">Transaction With Group</label>
                    <select id="transaction_with" class="form-select">
                        <option value="">Select With</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="fw-semibold">Transaction With User</label>
                    <select id="transaction_with_user" class="form-select">
                        <option value="">Select Supplier</option>
                    </select>
                </div>

            </div>

            <!-- 🔥 OLD FILTER FORM (KEPT AS IT IS) -->
            <form method="get" class="row g-2 align-items-end mb-3">

                <div class="col-md-3">
                    <input type="text" name="search"
                           class="form-control"
                           placeholder="Search by user"
                           value="{{ search }}">
                </div>

                <div class="col-md-2">
                    <select name="status" class="form-select">
                        <option value="">Status</option>
                        <option value="1" {% if status_filter == '1' %}selected{% endif %}>Verified</option>
                        <option value="0" {% if status_filter == '0' %}selected{% endif %}>Non Verified</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="small fw-semibold">Start Date</label>
                    <input type="date" id="start_date"
                           name="start_date"
                           class="form-control"
                           value="{{ start_date }}">
                </div>

                <div class="col-md-2">
                    <label class="small fw-semibold">End Date</label>
                    <input type="date" id="end_date"
                           name="end_date"
                           class="form-control"
                           value="{{ end_date }}">
                </div>

                <div class="col-md-2">
                    <select id="perPage"
                            name="per_page"
                            class="form-select">
                        {% for n in per_page_options %}
                            <option value="{{ n }}"
                                {% if per_page == n %}selected{% endif %}>
                                {{ n }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-1 d-grid">
                    <button type="button" id="paymentFilterBtn" class="btn btn-primary">
                        Filter
                    </button>
                </div>

            </form>

            <!-- 🔥 PAYMENT TABLE -->
            <div class="card">

                <div class="card-header bg-success text-white text-center">
                    Payment List
                </div>

                <div class="table-responsive"
                     style="max-height:400px; overflow-y:auto;">

                    <table class="table table-bordered table-sm">

                        <thead class="table-light sticky-top">

                            <tr>
                                <th>SL</th>
                                <th>Tran ID</th>
                                <th>Invoice Ref</th>
                                <th>Date</th>
                                <th>Supplier</th>
                                <th>Tran User</th>
                                <th class="text-end">Bill</th>
                                <th class="text-end">Discount</th>
                                <th class="text-end">Net</th>
                                <th class="text-end">Advance</th>
                                <th class="text-end">Due Col</th>
                                <th class="text-end">Due Disc</th>
                                <th class="text-end">Due</th>
                                <th class="text-center">Action</th>
                            </tr>

                        </thead>

                        <tbody id="paymentListTableBody">
                        </tbody>

                    </table>
                    <div class="row mt-3">

                        <div class="col-md-3">
                            <label>Total Due</label>
                            <input type="text"
                                id="total_due"
                                class="form-control"
                                readonly>
                        </div>

                        <div class="col-md-3">
                            <label>Payment</label>
                            <input type="number"
                                id="fifo_payment"
                                class="form-control"
                                disabled>
                        </div>

                        <div class="col-md-2">
                            <label>&nbsp;</label>
                            <button class="btn btn-primary form-control"
                                    id="fifo_pay_btn" disabled>
                                Proceed
                            </button>
                        </div>
                          <div class="text-center">
                            <button type="button" id="saveAllBtn" class="btn btn-primary px-5">Save</button>
                            <button id="printReportBtn" class="btn btn-dark px-4">
                                Print / Download PDF
                            </button>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
