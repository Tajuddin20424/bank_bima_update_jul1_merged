{% extends 'base.html' %}
{% load static %} 
{% block content %}

<div class="container-fluid mt-4">
  <div class="row">
    <!-- Form Panel -->
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Add New Bed Category</h5>
        </div>

        <div class="card-body">
          <form id="form">
            {% csrf_token %}

            <input type="hidden" id="id" name="id" />

            <div class="form-group mb-3">
              <label for="name" class="form-label">
                Name <span class="text-danger">*</span>
              </label>
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                placeholder="Enter bed category name"
                required
              />
            </div>

            <div class="form-group mb-3">
              <label for="status" class="form-label">Status</label>
              <select class="form-control" id="status" name="status">
                <option value="1" selected>Active</option>
                <option value="0">Inactive</option>
              </select>
            </div>

            <button
                type="button"
                id="saveBtn"
                class="btn btn-primary">
                Save
            </button>

            <button
              type="button"
              id="clearBtn"
              class="btn btn-secondary">
              ↶ Clear
          </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Table Panel -->
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
          <h5 class="mb-0">Bed Category List</h5>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped table-hover table-sm">
              <thead class="table-light">
                <tr>
                  <th>SL</th>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody id="tableBody">
                <tr>
                  <td colspan="5" class="text-center text-muted">Loading...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %} {% block extra_js %}
<script src="{% static 'js/save_csrftoken.js' %}"></script>
<script src="{% static 'js/bed_category/bed_category_load.js' %}"></script>
{% endblock %}
