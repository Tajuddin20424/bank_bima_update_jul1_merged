{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid mt-4">

    <h2 class="mb-4">
        Check In Details
    </h2>


    <!-- ================================================
         ADD BUTTON + SEARCH
    ================================================= -->

    <div class="row mb-4">

        <div class="col-md-6">

            <a
                href="{% url 'check_in_details_add' %}"
                class="btn btn-primary"
            >
                + Add Check In Details
            </a>

        </div>

    <!-- =====================================================
     CHECK IN DETAILS FILTER
====================================================== -->

<div class="card shadow-sm mb-3">

    <div class="card-body">

        <div class="row g-2 align-items-end">

            <!-- SEARCH -->
            <div class="col-md-3">

                <label class="form-label">
                    Search
                </label>

                <input
                    type="text"
                    id="search"
                    class="form-control"
                    placeholder="Search by guest"
                >

            </div>


            <!-- STATUS -->
            <div class="col-md-2">

                <label class="form-label">
                    Status
                </label>

                <select
                    id="filter_status"
                    class="form-control"
                >

                    <option value="">
                        Status
                    </option>

                    <option value="1">
                        Active
                    </option>

                    <option value="0">
                        Inactive
                    </option>

                </select>

            </div>


            <!-- START DATE -->
            <div class="col-md-2">

                <label class="form-label">
                    Start Date
                </label>

                <input
                    type="date"
                    id="start_date"
                    class="form-control"
                >

            </div>


            <!-- END DATE -->
            <div class="col-md-2">

                <label class="form-label">
                    End Date
                </label>

                <input
                    type="date"
                    id="end_date"
                    class="form-control"
                >

            </div>


            <!-- LIMIT -->
            <div class="col-md-2">

                <label class="form-label">
                    Show
                </label>

                <select
                    id="limit"
                    class="form-control"
                >

                    <option value="10">
                        50
                    </option>

                    <option value="25">
                        100
                    </option>

                    <option value="100">
                        200
                    </option>

                </select>

            </div>


            <!-- FILTER BUTTON -->
            <div class="col-md-1">

                <button
                    type="button"
                    id="filterBtn"
                    class="btn btn-primary w-100"
                >
                    Filter
                </button>

            </div>

        </div>

    </div>

</div>

    <!-- ================================================
         TABLE
    ================================================= -->

    <div class="card shadow-sm">

        <div class="card-header bg-success text-white">

            <h5 class="mb-0">
                Check In Details List
            </h5>

        </div>


        <div class="card-body">

            <div class="table-responsive">

                <table
                    class="table table-striped table-hover table-sm"
                >

                    <thead class="table-light">

                        <tr>

                            <th>SL</th>

                            <th>ID</th>

                            <th>Guest</th>

                            <th>Bed Category</th>

                            <th>Bed No</th>

                            <th>Check In</th>

                            <th>Check Out</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="checkInTableBody">

                        <tr>

                            <td
                                colspan="10"
                                class="text-center"
                            >
                                Loading...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script src="{% static 'js/save_csrftoken.js' %}"></script>

<script src="{% static 'js/check_in_details/check_in_details_load.js' %}"></script>

{% endblock %}
