{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="row">

        <!-- =====================================================
             LEFT SIDE - ADD CHECK IN FORM
        ====================================================== -->

        <div class="col-md-5">

            <div class="card shadow-sm">

                <div class="card-header bg-primary text-white">

                    <h5 class="mb-0">
                        Add Check In Details
                    </h5>

                </div>


                <div class="card-body">

                    <form id="checkInForm">

                        {% csrf_token %}


                        <input
                            type="hidden"
                            id="id"
                            name="id"
                        />


                        <!-- HOTEL GUEST -->

                        <div class="form-group mb-3">

                            <label
                                for="hotel_guest_id"
                                class="form-label"
                            >
                                Hotel Guest
                                <span class="text-danger">*</span>
                            </label>

                            <select
                                class="form-control"
                                id="hotel_guest_id"
                                name="hotel_guest_id"
                                required
                            >

                                <option value="">
                                    Select Guest
                                </option>

                            </select>

                        </div>


                        <!-- BED CATEGORY -->

                        <div class="form-group mb-3">

                            <label
                                for="bed_category_id"
                                class="form-label"
                            >
                                Bed Category
                                <span class="text-danger">*</span>
                            </label>

                            <select
                                class="form-control"
                                id="bed_category_id"
                                name="bed_category_id"
                                required
                            >

                                <option value="">
                                    Select Bed Category
                                </option>

                            </select>

                        </div>


                        <!-- BED INFO -->

                        <div class="form-group mb-3">

                            <label
                                for="bed_info_id"
                                class="form-label"
                            >
                                Bed No
                                <span class="text-danger">*</span>
                            </label>

                            <select
                                class="form-control"
                                id="bed_info_id"
                                name="bed_info_id"
                                required
                            >

                                <option value="">
                                    Select Bed Info
                                </option>

                            </select>

                        </div>


                        <!-- CHECK IN -->

                        <div class="form-group mb-3">

                            <label
                                for="check_in"
                                class="form-label"
                            >
                                Check In
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                type="datetime-local"
                                class="form-control"
                                id="check_in"
                                name="check_in"
                                required
                            />

                        </div>


                        <!-- CHECK OUT -->

                        <div class="form-group mb-3">

                            <label
                                for="check_out"
                                class="form-label"
                            >
                                Check Out
                            </label>

                            <input
                                type="datetime-local"
                                class="form-control"
                                id="check_out"
                                name="check_out"
                            />

                        </div>


                        <!-- REMARKS -->

                        <div class="form-group mb-3">

                            <label
                                for="remarks"
                                class="form-label"
                            >
                                Remarks
                            </label>

                            <textarea
                                class="form-control"
                                id="remarks"
                                name="remarks"
                                rows="3"
                                placeholder="Enter remarks"
                            ></textarea>

                        </div>


                        <!-- STATUS -->

                        <div class="form-group mb-3">

                            <label
                                for="status"
                                class="form-label"
                            >
                                Status
                            </label>

                            <select
                                class="form-control"
                                id="status"
                                name="status"
                            >

                                <option value="1" selected>
                                    Active
                                </option>

                                <option value="0">
                                    Inactive
                                </option>

                            </select>

                        </div>


                        <!-- BUTTON -->

                        <button
                            type="button"
                            id="saveBtn"
                            class="btn btn-primary"
                        >
                            Save
                        </button>


                        <button
                            type="button"
                            id="clearBtn"
                            class="btn btn-secondary"
                        >
                            Clear
                        </button>


                        <a
                            href="{% url 'check_in_details_list' %}"
                            class="btn btn-danger"
                        >
                            Back
                        </a>

                    </form>

                </div>

            </div>

        </div>


        <!-- =====================================================
             RIGHT SIDE - CHECK IN DETAILS TABLE
        ====================================================== -->

        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-header bg-success text-white">

                    <h5 class="mb-0">
                        Check In Details List
                    </h5>

                </div>


                <div class="card-body">

                    <!-- SEARCH -->

                    <div class="mb-3">

                        <input
                            type="text"
                            id="checkInSearch"
                            class="form-control"
                            placeholder="Search..."
                        />

                    </div>


                    <div class="table-responsive">

                        <table
                            class="table table-striped table-hover table-sm"
                            id="checkInTable"
                        >

                            <thead class="table-light">

                                <tr>

                                    <th>SL</th>

                                    <th>ID</th>

                                    <th>Guest</th>

                                    <th>Bed Category</th>

                                    <th>Bed No</th>

                                    <th>Check In</th>

                                    <th>Check Out</th>

                                    <th>Status</th>

                                    <th>Action</th>

                                </tr>

                            </thead>


                            <tbody id="checkInTableBody">


                                <tr>

                                    <td
                                        colspan="10"
                                        class="text-center text-muted"
                                    >
                                        Loading...
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script src="{% static 'js/save_csrftoken.js' %}"></script>

<script src="{% static 'js/check_in_details/check_in_details_load.js' %}"></script>

<script src="{% static 'js/bed_category/combo_category.js' %}"></script>

<script src="{% static 'js/bed_info/combo_info.js' %}"></script>

{% endblock %}
