{% extends 'base.html' %}
{% load static %}

{% block title %}Add Transaction With{% endblock %} 

{% block content %}


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Teacher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <div class="row">
      
      <!-- Left: Add Subject Form -->

      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <h2>Add Transaction With</h2>
          <form id="addForm" method="POST">
            {% csrf_token %}

            <!-- <input type="hidden" id="tran_with_id"> -->
            <input id="tran_with_id">

            <div class="mb-3">
                <label class="form-label fw-semibold">Account Main Heads</label>
                <select id="transactionmainheads" name="transactionmainheads" class="form-control">

                </select>
            </div>
            <div>
                <select name="tran_method" id="tran_method" class="form-control mb-2">
                    <option value="Receive">Receive</option>
                    <option value="Payment">Payment</option>
                    <option value="Both">Both</option>
                </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Transaction With</label>
              <input type="text" id="tran_with" name="tran_with" class="form-control" placeholder="Enter with name" required>
            </div>
            <div class="d-flex justify-content-center mt-3">
              <button type="submit" id="saveBtn" class="btn btn-primary me-2 px-4">
                💾 Save
              </button>
            </div>

          </form>
        </div>
      </div>

        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <div class="table-responsive" style="max-height: 800px; overflow-y: auto;" id="tableContainerRight">
                    <table class="table table-bordered table-striped table-hover table-sm custom-border full-width-table" id="staffTableRight">
                        <thead class="table-dark" style="position: sticky; top: 0; z-index: 2;">
                            <tr>
                                <th style="width:50px;">#</th>
                                <th style="width:20px;">Main ID</th>
                                <th style="width:250px;">Transaction Main Head</th>
                                <th style="width:20px;">With ID</th>
                                <th style="width:250px;">Transaction With</th>
                                <th style="width:250px;">Method</th>
                                <th style="width:200px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="transactionWithTableBody">
                            <!-- Rows loaded dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
  </div>  

</body>
</html>


{% endblock %}

{% block extra_js %}
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="{% static 'js/save_csrftoken.js' %}"></script>
    <!-- <script src="{% static 'js/transaction_?main_heads/transaction_main_heads_combo.js' %}"></script> -->
    <script src="{% static 'js/combo_load/transaction_main_heads_combo.js' %}"></script>
    <script src="{% static 'js/transaction_with/transaction_with.js' %}"></script>


{% endblock %}
